{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – SecurePortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo" style="background:linear-gradient(135deg,#d97706,#78350f);">
        <i class="bi bi-key-fill"></i>
      </div>
      <span class="brand-name">Password Reset</span>
      <span class="brand-sub">Enter your registered email</span>
    </div>
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %}">
          <i class="bi bi-{% if msg.tags == 'error' %}exclamation-triangle-fill{% else %}check-circle-fill{% endif %}"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
    <p class="section-sub">A 1-minute security code will be sent to your registered corporate email.</p>
    <form method="post" action="{% url 'forgot_password' %}" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Registered Email Address</label>
        <div class="input-group">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input type="email" id="id_email" name="email" class="form-control"
                 placeholder="your.email@company.com" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="bi bi-send-fill"></i> Send Reset Code
      </button>
    </form>
    <hr class="divider">
    <p class="text-center"><a href="{% url 'user_login' %}" class="link-sm"><i class="bi bi-arrow-left"></i> Back to Login</a></p>
  </div>
</div>
</body>
</html>
