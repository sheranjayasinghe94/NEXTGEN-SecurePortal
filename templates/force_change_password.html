{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password – SecurePortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo" style="background:linear-gradient(135deg,#d97706,#78350f);">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <span class="brand-name">Password Change Required</span>
      <span class="brand-sub">First login — you must set a new password</span>
    </div>
    <div class="alert alert-warning">
      <i class="bi bi-exclamation-triangle-fill"></i>
      You are using a temporary password. Please set a new secure password to continue.
    </div>
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}success{% endif %}">
          <i class="bi bi-{% if msg.tags == 'error' %}exclamation-triangle-fill{% else %}check-circle-fill{% endif %}"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
    <form method="post" action="{% url 'force_change_password' %}" autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_new_password">New Password</label>
        <div class="input-group">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" id="id_new_password" name="new_password" class="form-control"
                 placeholder="Minimum 8 characters" required minlength="8" autofocus>
          <span class="input-toggle" onclick="togglePw('id_new_password','ic1')"><i class="bi bi-eye-fill" id="ic1"></i></span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="id_confirm_password">Confirm New Password</label>
        <div class="input-group">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" id="id_confirm_password" name="confirm_password" class="form-control"
                 placeholder="Repeat your new password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="bi bi-arrow-right-circle-fill"></i> Save & Continue Login
      </button>
    </form>
  </div>
</div>
<script>
function togglePw(id, ic) {
  const i = document.getElementById(id), ico = document.getElementById(ic);
  i.type = i.type === 'password' ? 'text' : 'password';
  ico.className = i.type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
}
</script>
</body>
</html>
